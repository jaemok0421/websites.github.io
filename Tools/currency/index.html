<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>汇率换算</title>
  <meta name="description" content="使用公开汇率数据，快速换算常用货币。">
  <link rel="stylesheet" href="../css/tool.css">
  <style>
    .converter {
      overflow: hidden;
      padding: 0;
    }

    .converter-main {
      padding: 26px;
    }

    .currency-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
      gap: 14px;
      align-items: end;
    }

    .swap {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .swap:hover {
      background: #d5f0e7;
      transform: rotate(180deg);
    }

    .amount-input {
      margin-top: 18px;
    }

    .amount-input input {
      font-size: 22px;
      font-weight: 650;
    }

    .result-card {
      margin-top: 18px;
      padding: 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e6f7f2, #f4fbf8);
      border: 1px solid #cce9df;
    }

    .result-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .result-value {
      margin: 0;
      color: var(--accent);
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .rate-line {
      margin: 12px 0 0;
      color: var(--ink);
      font-size: 14px;
    }

    .converter-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 26px;
      border-top: 1px solid var(--line);
      background: #f8fafc;
    }

    .converter-footer p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .quick-panel {
      margin-top: 16px;
    }

    .quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .quick-pair {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .quick-pair:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .loading .result-value {
      opacity: 0.45;
    }

    @media (max-width: 640px) {
      .converter-main {
        padding: 18px 16px;
      }

      .currency-grid {
        grid-template-columns: 1fr 44px 1fr;
        gap: 8px;
      }

      .swap {
        width: 44px;
        height: 44px;
      }

      .converter-footer {
        padding: 14px 16px;
      }
    }

    @media (max-width: 420px) {
      .currency-grid {
        grid-template-columns: 1fr;
      }

      .swap {
        justify-self: center;
        transform: rotate(90deg);
      }

      .swap:hover {
        transform: rotate(270deg);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="crumb">
      <a href="../../index.html">首页</a><span>/</span>
      <a href="../index.html">网页工具箱</a><span>/</span>
      <span>汇率换算</span>
    </nav>

    <header class="tool-header">
      <h1>汇率换算</h1>
      <p>查询公开参考汇率，快速换算世界常用货币。</p>
    </header>

    <main>
      <section class="panel converter" id="converter">
        <div class="converter-main">
          <div class="currency-grid">
            <div class="field">
              <label for="from-currency">从</label>
              <select id="from-currency" aria-label="原始货币"></select>
            </div>

            <button class="swap" id="swap" type="button" aria-label="交换货币" title="交换货币">⇄</button>

            <div class="field">
              <label for="to-currency">换算为</label>
              <select id="to-currency" aria-label="目标货币"></select>
            </div>
          </div>

          <div class="field amount-input">
            <label for="amount">金额</label>
            <input id="amount" type="number" value="100" min="0" step="any" inputmode="decimal" autocomplete="off">
          </div>

          <div class="result-card" aria-live="polite">
            <p class="result-label">换算结果</p>
            <p class="result-value" id="result">正在获取汇率…</p>
            <p class="rate-line" id="rate-line"></p>
          </div>

          <div class="actions" style="margin-top:16px">
            <button class="btn secondary" id="copy" type="button">复制结果</button>
            <button class="btn ghost" id="refresh" type="button">刷新汇率</button>
          </div>
          <p class="status" id="status" style="margin-top:12px"></p>
        </div>

        <footer class="converter-footer">
          <p id="updated">汇率日期：--</p>
          <p id="source">数据来源：-- · 仅供参考</p>
        </footer>
      </section>

      <section class="panel quick-panel">
        <span class="group-title">常用货币对</span>
        <div class="quick-list">
          <button class="quick-pair" type="button" data-from="USD" data-to="CNY">美元 → 人民币</button>
          <button class="quick-pair" type="button" data-from="CNY" data-to="USD">人民币 → 美元</button>
          <button class="quick-pair" type="button" data-from="EUR" data-to="CNY">欧元 → 人民币</button>
          <button class="quick-pair" type="button" data-from="JPY" data-to="CNY">日元 → 人民币</button>
          <button class="quick-pair" type="button" data-from="GBP" data-to="CNY">英镑 → 人民币</button>
          <button class="quick-pair" type="button" data-from="HKD" data-to="CNY">港币 → 人民币</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const currencies = {
      AUD: "澳大利亚元", BGN: "保加利亚列弗", BRL: "巴西雷亚尔", CAD: "加拿大元",
      CHF: "瑞士法郎", CNY: "人民币", CZK: "捷克克朗", DKK: "丹麦克朗",
      EUR: "欧元", GBP: "英镑", HKD: "港币", HUF: "匈牙利福林",
      IDR: "印度尼西亚卢比", ILS: "以色列新谢克尔", INR: "印度卢比", ISK: "冰岛克朗",
      JPY: "日元", KRW: "韩元", MXN: "墨西哥比索", MYR: "马来西亚林吉特",
      NOK: "挪威克朗", NZD: "新西兰元", PHP: "菲律宾比索", PLN: "波兰兹罗提",
      RON: "罗马尼亚列伊", SEK: "瑞典克朗", SGD: "新加坡元", THB: "泰铢",
      TRY: "土耳其里拉", USD: "美元", ZAR: "南非兰特"
    };

    const fromEl = document.getElementById("from-currency");
    const toEl = document.getElementById("to-currency");
    const amountEl = document.getElementById("amount");
    const resultEl = document.getElementById("result");
    const rateLineEl = document.getElementById("rate-line");
    const statusEl = document.getElementById("status");
    const updatedEl = document.getElementById("updated");
    const sourceEl = document.getElementById("source");
    const converterEl = document.getElementById("converter");
    let rates = {};
    let ratesBase = "";
    let rateDate = "";
    let requestId = 0;

    function populateCurrencies() {
      const options = Object.entries(currencies)
        .map(([code, name]) => `<option value="${code}">${code} · ${name}</option>`)
        .join("");
      fromEl.innerHTML = options;
      toEl.innerHTML = options;
      fromEl.value = "USD";
      toEl.value = "CNY";
    }

    function formatNumber(value, maximumFractionDigits = 6) {
      return new Intl.NumberFormat("zh-CN", {
        maximumFractionDigits,
        minimumFractionDigits: 0
      }).format(value);
    }

    function formatMoney(value, currency) {
      try {
        return new Intl.NumberFormat("zh-CN", {
          style: "currency",
          currency,
          currencyDisplay: "code",
          maximumFractionDigits: 6
        }).format(value);
      } catch {
        return `${formatNumber(value)} ${currency}`;
      }
    }

    function showStatus(message = "", type = "") {
      statusEl.textContent = message;
      statusEl.className = `status${type ? ` ${type}` : ""}`;
    }

    function render() {
      const amount = Number(amountEl.value);
      const to = toEl.value;
      const rate = fromEl.value === to ? 1 : (ratesBase === fromEl.value ? rates[to] : undefined);

      if (!Number.isFinite(amount) || amount < 0) {
        resultEl.textContent = "请输入有效的非负金额";
        rateLineEl.textContent = "";
        showStatus("金额格式无效。", "error");
        return;
      }

      if (!Number.isFinite(rate)) {
        resultEl.textContent = "暂无可用汇率";
        rateLineEl.textContent = "";
        return;
      }

      const converted = amount * rate;
      resultEl.textContent = formatMoney(converted, to);
      rateLineEl.textContent = `1 ${fromEl.value} = ${formatNumber(rate, 8)} ${to}`;
      showStatus();
    }

    function readCache(base) {
      try {
        return JSON.parse(localStorage.getItem(`currency-rates-${base}`));
      } catch {
        return null;
      }
    }

    function saveCache(base, data) {
      try {
        localStorage.setItem(`currency-rates-${base}`, JSON.stringify(data));
      } catch {
        // 隐私模式或存储空间不足时仍可正常换算。
      }
    }

    async function fetchLatestRates(base) {
      try {
        const response = await fetch(`https://api.frankfurter.dev/v2/rates?base=${encodeURIComponent(base)}`);
        if (!response.ok) throw new Error(`Frankfurter HTTP ${response.status}`);
        const rows = await response.json();
        if (!Array.isArray(rows) || rows.length === 0) throw new Error("Frankfurter 返回数据无效");
        return {
          date: rows[0].date,
          rates: Object.fromEntries(rows.map((row) => [row.quote, Number(row.rate)])),
          source: "Frankfurter",
          fallback: false
        };
      } catch (primaryError) {
        const response = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(base)}`);
        if (!response.ok) throw new Error(`备用接口 HTTP ${response.status}`, { cause: primaryError });
        const data = await response.json();
        if (data.result !== "success" || !data.rates) {
          throw new Error("备用接口返回数据无效", { cause: primaryError });
        }
        return {
          date: new Date(data.time_last_update_unix * 1000).toISOString().slice(0, 10),
          rates: data.rates,
          source: "ExchangeRate-API",
          fallback: true
        };
      }
    }

    async function loadRates(force = false) {
      const base = fromEl.value;
      const currentRequest = ++requestId;
      converterEl.classList.add("loading");
      showStatus("正在获取最新参考汇率…");
      if (ratesBase !== base) {
        resultEl.textContent = "正在获取汇率…";
        rateLineEl.textContent = "";
      }

      if (!force) {
        const cached = readCache(base);
        if (cached && cached.date && cached.rates) {
          rates = cached.rates;
          ratesBase = base;
          rateDate = cached.date;
          updatedEl.textContent = `汇率日期：${rateDate}（缓存）`;
          sourceEl.textContent = `数据来源：${cached.source || "公开汇率接口"} · 仅供参考`;
          render();
        }
      }

      try {
        const data = await fetchLatestRates(base);
        if (currentRequest !== requestId) return;

        rates = { ...data.rates, [base]: 1 };
        ratesBase = base;
        rateDate = data.date;
        saveCache(base, { date: rateDate, rates, source: data.source });
        updatedEl.textContent = `汇率日期：${rateDate}`;
        sourceEl.textContent = `数据来源：${data.source} · 仅供参考`;
        render();
        if (data.fallback) showStatus("主数据源暂不可用，已切换至备用汇率。", "ok");
      } catch {
        if (currentRequest !== requestId) return;
        const cached = readCache(base);
        if (cached && cached.rates) {
          rates = cached.rates;
          ratesBase = base;
          rateDate = cached.date || "";
          updatedEl.textContent = `汇率日期：${rateDate || "--"}（离线缓存）`;
          sourceEl.textContent = `数据来源：${cached.source || "离线缓存"} · 仅供参考`;
          render();
          showStatus("网络不可用，当前显示上次保存的汇率。", "error");
        } else {
          rates = base === toEl.value ? { [base]: 1 } : {};
          ratesBase = base;
          render();
          showStatus("汇率获取失败，请检查网络后重试。", "error");
        }
      } finally {
        if (currentRequest === requestId) converterEl.classList.remove("loading");
      }
    }

    fromEl.addEventListener("change", () => loadRates());
    toEl.addEventListener("change", render);
    amountEl.addEventListener("input", render);

    document.getElementById("swap").addEventListener("click", () => {
      const previousFrom = fromEl.value;
      fromEl.value = toEl.value;
      toEl.value = previousFrom;
      loadRates();
    });

    document.getElementById("refresh").addEventListener("click", () => loadRates(true));

    document.getElementById("copy").addEventListener("click", async () => {
      if (!Number.isFinite(rates[toEl.value]) && fromEl.value !== toEl.value) return;
      try {
        await navigator.clipboard.writeText(`${amountEl.value} ${fromEl.value} = ${resultEl.textContent}`);
        showStatus("换算结果已复制。", "ok");
      } catch {
        showStatus("复制失败，请手动选择结果复制。", "error");
      }
    });

    document.querySelectorAll(".quick-pair").forEach((button) => {
      button.addEventListener("click", () => {
        fromEl.value = button.dataset.from;
        toEl.value = button.dataset.to;
        loadRates();
      });
    });

    populateCurrencies();
    loadRates();
  </script>
</body>
</html>
